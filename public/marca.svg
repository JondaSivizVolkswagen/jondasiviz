    que define la herramienta.
  -->
  <rect width="512" height="512" rx="112" fill="#C0322E"/>
  <path d="M322 128v186c0 46-37 82-83 82-40 0-73-28-81-66"
        fill="none" stroke="#FFFFFF" stroke-width="42"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="128" y="128" width="130" height="42" rx="21" fill="#FFFFFF"/>
</svg>
