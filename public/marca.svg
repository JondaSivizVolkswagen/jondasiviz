<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Icono de la aplicación. Nada de logotipos de Volkswagen: el proyecto no tiene
    relación con la marca y usar el suyo sería un problema. Esto es una "J" de
