[package]
name = "jondasiviz"
version = "0.1.1"
description = "Planificador de presupuestos de preparacion para modelos Volkswagen"
authors = ["JondaSiviz"]
edition = "2021"
rust-version = "1.77.2"

# La logica del planner es TypeScript y vive en src/. Rust aqui solo abre la ventana
# y sirve el frontend ya compilado, asi que este crate no deberia crecer.
[lib]
name = "jondasiviz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
