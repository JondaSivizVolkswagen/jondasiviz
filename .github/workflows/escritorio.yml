##
# Compila la version de escritorio para Windows, macOS y Linux, y publica los binarios
# en una Release de GitHub.
#
# Esto no se puede hacer desde un solo ordenador: un binario hay que compilarlo en el
# sistema al que va, y el de macOS necesita el SDK de Apple, que solo corre en un Mac.
# Por eso hay una maquina por sistema.
#
# Se dispara al empujar una etiqueta de version (v0.1.0) o a mano desde la pestaña
# Actions. Los binarios NO van firmados: Windows enseñara el aviso de SmartScreen y
# macOS pedira permiso en Preferencias. Firmarlos cuesta una cuenta de Apple Developer
# y un certificado de Windows; se hara cuando el proyecto lo justifique.
##
name: Escritorio

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Necesario para que la accion pueda crear la Release y subirle ficheros.
permissions:
  contents: write

jobs:
  compilar:
    strategy:
      # Si falla un sistema, los otros terminan igual y se ve todo lo que falla de una vez.
      fail-fast: false
      matrix:
        include:
          - plataforma: macos-latest
            args: "--target aarch64-apple-darwin"
            nombre: macOS (Apple Silicon)
          - plataforma: macos-latest
            args: "--target x86_64-apple-darwin"
            nombre: macOS (Intel)
          - plataforma: ubuntu-22.04
            args: ""
            nombre: Linux
          - plataforma: windows-latest
            args: ""
            nombre: Windows

    name: ${{ matrix.nombre }}
    runs-on: ${{ matrix.plataforma }}

    steps:
      - uses: actions/checkout@v4

      # Dependencias de sistema de webkit2gtk, que es el motor web que usa Tauri en
      # Linux. En Windows y macOS el motor ya viene con el sistema.
      - name: Dependencias de Linux
        if: matrix.plataforma == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libxdo-dev \
            libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.plataforma == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # El motor y el catalogo se prueban antes de empaquetar: no tiene sentido publicar
      # un binario que no pasa sus propios tests.
      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "JondaSiviz Build Planner __VERSION__"
          releaseBody: |
            Planificador de presupuestos de preparacion para Volkswagen.

            ## Windows

            Baja **JondaSiviz-Windows-instalador.exe**. Instala para tu usuario, asi que
            no pide permisos de administrador. El .msi hace lo mismo pero para toda la
            maquina, y es el que conviene si lo despliegas por directiva de grupo.

            Windows enseñara una pantalla azul que dice "Windows protegio tu PC" y
            "Editor desconocido". No es que el programa tenga nada: es que el instalador
            no va firmado con un certificado de pago, y SmartScreen avisa de todo lo que
            no reconoce. Para continuar: **Mas informacion** y luego **Ejecutar de todas
            formas**.

            Si prefieres comprobar que el fichero es el que salio de esta compilacion,
            compara su huella con la de SHA256SUMS-Windows.txt:

                Get-FileHash .\JondaSiviz-Windows-instalador.exe -Algorithm SHA256

            ## macOS y Linux

            macOS pedira permiso en Ajustes -> Privacidad y seguridad, por el mismo
            motivo. En Linux el AppImage necesita permiso de ejecucion (`chmod +x`).

            Los precios del catalogo son orientativos. Proyecto personal, sin relacion
            con Volkswagen AG.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Los ficheros que genera Tauri llevan la version en el nombre
      # ("JondaSiviz Build Planner_0.1.0_x64_en-US.msi"), asi que su URL cambia en cada
      # version y la landing no podria enlazarlos. Se suben copias con nombre fijo para
      # que /releases/latest/download/<nombre> funcione siempre.
      - name: Copias con nombre estable
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUTAS: ${{ steps.tauri.outputs.artifactPaths }}
          SUFIJO: ${{ contains(matrix.args, 'aarch64') && '-AppleSilicon' || contains(matrix.args, 'x86_64-apple') && '-Intel' || '' }}
        run: |
          set -euo pipefail
          mkdir -p estables

          # En Windows las rutas llegan como "D:\a\repo\..." y el bash de Git no entiende
          # ni esa forma ni "D:/a/...": necesita "/d/a/...". `cygpath` hace justo esa
          # traduccion y viene con Git for Windows. En Linux y macOS no existe y las
          # rutas ya son correctas, asi que se usan tal cual.
          while read -r ruta; do
            if command -v cygpath >/dev/null 2>&1; then
              ruta="$(cygpath -u "$ruta")"
            fi
            if [ ! -f "$ruta" ]; then
              echo "::error::No existe el fichero que anuncio tauri-action: $ruta"
              exit 1
            fi
            case "$ruta" in
              *.msi)      destino="JondaSiviz-Windows.msi" ;;
              *setup.exe) destino="JondaSiviz-Windows-instalador.exe" ;;
              *.dmg)      destino="JondaSiviz-macOS${SUFIJO}.dmg" ;;
              *.AppImage) destino="JondaSiviz-Linux.AppImage" ;;
              *.deb)      destino="JondaSiviz-Linux.deb" ;;
              *)          echo "sin nombre estable para $ruta, se deja como esta"; continue ;;
            esac
            cp "$ruta" "estables/$destino"
            echo "$ruta  ->  $destino"
          done < <(echo "$RUTAS" | jq -r '.[]')

          # Si no sale ninguna copia es que algo ha cambiado de nombre o de sitio: hay
          # que enterarse aqui y no descubrirlo con un enlace roto en la landing.
          if [ -z "$(ls -A estables 2>/dev/null)" ]; then
            echo "::error::Ningun artefacto encajo con los nombres estables. Rutas: $RUTAS"
            exit 1
          fi

          # Huella SHA-256 de cada instalador. Mientras los binarios no vayan firmados,
          # es lo unico que permite a alguien comprobar que el fichero que se ha bajado
          # es el que salio de esta compilacion y no algo que se colo por el camino.
          # En Windows se comprueba con: Get-FileHash .\fichero -Algorithm SHA256
          # macOS no trae `sha256sum` (es de coreutils); ahi el equivalente es
          # `shasum -a 256`. Sin esto el paso reventaria en los dos runners de Apple.
          # Un fichero por sistema. Los cuatro jobs suben a la misma Release con
          # --clobber, asi que un nombre comun haria que el ultimo en terminar borrase
          # las huellas de los demas.
          HUELLAS="SHA256SUMS-${{ runner.os }}${SUFIJO}.txt"
          if command -v sha256sum >/dev/null 2>&1; then
            ( cd estables && sha256sum * > "$HUELLAS" )
          else
            ( cd estables && shasum -a 256 * > "$HUELLAS" )
          fi
          cat "estables/$HUELLAS"

          gh release upload "${{ github.ref_name }}" estables/* --clobber --repo "${{ github.repository }}"
