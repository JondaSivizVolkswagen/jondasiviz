<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/marca.svg" />
    <title>JondaSiviz Build Planner</title>
    <style>
      /*
        Pantalla de inicio de la aplicación de escritorio. Al abrir el programa no tiene
        sentido soltar al usuario dentro del formulario, como si fuese una web: primero
        un menú que diga dónde está y qué puede hacer.

        Mismos tokens que el resto del proyecto para que no parezca otra aplicación.
      */
      :root {
        --bg: #fbfbfa;
        --surface: #ffffff;
        --surface-2: #f4f4f3;
        --text: #1d1d1f;
        --text-muted: #6b6b70;
        --border: #e7e7e4;
        --accent: #c0322e;
        --accent-hover: #a02824;
        --accent-contrast: #ffffff;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
        --shadow-md: 0 1px 2px rgba(0, 0, 0, 0.04), 0 10px 28px rgba(0, 0, 0, 0.07);
        --r-sm: 8px;
        --r-md: 12px;
        --r-lg: 20px;
        --font: "Segoe UI Variable", "Segoe UI", -apple-system, BlinkMacSystemFont,
          "SF Pro Text", Roboto, sans-serif;
        color-scheme: light dark;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101012;
          --surface: #171719;
          --surface-2: #1e1e22;
          --text: #f5f5f7;
          --text-muted: #9b9ba2;
          --border: #2b2b30;
          --accent: #e0605a;
          --accent-hover: #ea7772;
          --accent-contrast: #0b0b0c;
          --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
          --shadow-md: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.45);
        }
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        font-family: var(--font);
        font-size: 17px;
        line-height: 1.6;
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
        /* Es una app, no una web: seleccionar el texto del menú no aporta nada. */
        user-select: none;
      }

      .menu {
        width: 100%;
        max-width: 460px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
        text-align: center;
      }

      .marca-icono {
        width: 76px;
        height: 76px;
        border-radius: 20px;
        box-shadow: var(--shadow-md);
      }

      h1 {
        font-size: 1.9rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }

      .lema {
        margin-top: 10px;
        font-size: 0.98rem;
        color: var(--text-muted);
        max-width: 34ch;
      }

      .opciones {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .opcion {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        padding: 16px 18px;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 500;
        text-align: left;
        text-decoration: none;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-md);
        box-shadow: var(--shadow-sm);
        cursor: pointer;
        transition: border-color 0.18s ease-out, background 0.18s ease-out,
          transform 0.18s ease-out;
      }

      .opcion:hover { background: var(--surface-2); border-color: var(--text-muted); }
      .opcion:active { transform: translateY(1px); }

      .opcion:focus-visible {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
      }

      .opcion svg { width: 20px; height: 20px; flex: 0 0 auto; color: var(--text-muted); }
      .opcion small { display: block; font-size: 0.82rem; font-weight: 400; color: var(--text-muted); }

      /* La opción principal, que es a lo que se viene. */
      .opcion.principal {
        color: var(--accent-contrast);
        background: var(--accent);
        border-color: var(--accent);
      }
      .opcion.principal:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
      .opcion.principal svg { color: var(--accent-contrast); }
      .opcion.principal small { color: color-mix(in srgb, var(--accent-contrast) 78%, transparent); }

      /* Estás aquí. No lleva a ningún sitio, solo sitúa. */
      .opcion.actual { cursor: default; background: var(--surface-2); }
      .opcion.actual:hover { border-color: var(--border); }
      .opcion.actual:active { transform: none; }

      .pie { font-size: 0.8rem; color: var(--text-muted); max-width: 40ch; }

      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
      }
    </style>
  </head>

  <body>
    <main class="menu">
      <div>
        <img class="marca-icono" src="/marca.svg" alt="" width="76" height="76" />
        <h1>JondaSiviz Build Planner</h1>
        <p class="lema">
          Planifica la preparación de tu Volkswagen sin pasarte del presupuesto.
        </p>
      </div>

      <nav class="opciones">
        <div class="opcion actual" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
          <span>Inicio<small>Estás en la pantalla de inicio</small></span>
        </div>

        <a class="opcion principal" href="/herramienta.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          <span>Probar JondaSiviz<small>Modelo, presupuesto y objetivo</small></span>
        </a>

        <button class="opcion" type="button" id="salir">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 12H3M7 8l-4 4 4 4"/><path d="M11 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg>
          <span>Salir<small>Cierra la aplicación</small></span>
        </button>
      </nav>

      <p class="pie">
        Los precios son orientativos. Proyecto personal, sin relación con Volkswagen AG.
      </p>
    </main>

    <script>
      (function () {
        var salir = document.getElementById('salir');

        // `withGlobalTauri` deja la API en window.__TAURI__, asi que esta pagina no
        // necesita ningun bundle: es HTML suelto, igual que la landing.
        var enTauri = !!(window.__TAURI__ || window.__TAURI_INTERNALS__);

        if (!enTauri) {
          // La misma pagina existe en el build web, y ahi una web no puede cerrarse
          // sola. Antes que dejar un boton que no hace nada, se quita.
          salir.remove();
          return;
        }

        salir.addEventListener('click', function () {
          try {
            window.__TAURI__.window.getCurrentWindow().close();
          } catch (e) {
            // Si la API cambia de sitio en una version futura, al menos se ve por que.
            console.error('No se pudo cerrar la ventana:', e);
          }
        });
      })();
    </script>
  </body>
</html>
