<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Jondasiviz Build Planner</title>
    <style>
      /*
        Pantalla de inicio de la aplicación de escritorio. Al abrir el programa no tiene
        sentido soltar al usuario dentro del formulario, como si fuese una web: primero
        un menú que diga dónde está y qué puede hacer.

        Los tokens son los mismos que el resto del proyecto, pero copiados a mano: esta
        página es HTML suelto sin bundler, igual que antes, así no depende de Vite ni de
        ninguna hoja externa para arrancar dentro de Tauri.
      */
      :root {
        --negro: #08090b;
        --panel: #0e1014;
        --panel-2: #13161b;
        --linea: rgba(255, 255, 255, 0.07);
        --linea-fuerte: rgba(255, 255, 255, 0.14);
        --texto: #eef0f3;
        --tenue: #6e757e;
        --apagado: #464c54;
        --rojo: #e3121c;
        --display: "Archivo", "Segoe UI Variable", "Segoe UI", -apple-system, sans-serif;
        --mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
        --curva: cubic-bezier(0.16, 1, 0.3, 1);
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        font-family: var(--display);
        font-size: 16px;
        line-height: 1.55;
        background: var(--negro);
        color: var(--texto);
        -webkit-font-smoothing: antialiased;
      }

      /* Halo rojo detrás del menú, el mismo recurso que usa la portada. */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(60% 45% at 50% 30%, rgba(227, 18, 28, 0.12), transparent 70%);
        pointer-events: none;
      }

      .menu {
        position: relative;
        width: 100%;
        max-width: 460px;
      }

      .cabecera {
        text-align: center;
        margin-bottom: 34px;
      }

      .portada {
        width: 168px;
        height: 168px;
        object-fit: contain;
        filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.6));
      }

      h1 {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.035em;
        text-transform: uppercase;
        margin-top: 14px;
      }

      .lema {
        color: var(--tenue);
        font-size: 13.5px;
        margin-top: 10px;
      }

      .opciones {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .opcion {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        text-align: left;
        padding: 18px 20px;
        background: var(--panel);
        border: 1px solid var(--linea);
        color: var(--texto);
        font: inherit;
        text-decoration: none;
        cursor: pointer;
        position: relative;
        transition: background 0.3s, border-color 0.3s;
      }

      .opcion::after {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--rojo);
        transform: scaleY(0);
        transform-origin: bottom;
        transition: transform 0.35s var(--curva);
      }

      .opcion:hover {
        background: var(--panel-2);
        border-color: var(--linea-fuerte);
      }

      .opcion:hover::after,
      .opcion.principal::after {
        transform: scaleY(1);
      }

      .opcion svg {
        width: 18px;
        height: 18px;
        color: var(--tenue);
        flex: none;
      }

      .opcion.principal svg {
        color: var(--rojo);
      }

      .opcion span {
        display: flex;
        flex-direction: column;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .opcion small {
        font-family: var(--display);
        font-size: 12px;
        letter-spacing: 0;
        text-transform: none;
        color: var(--tenue);
        margin-top: 3px;
      }

      .opcion.actual {
        cursor: default;
        opacity: 0.55;
      }

      .opcion.actual:hover {
        background: var(--panel);
        border-color: var(--linea);
      }

      .opcion.actual:hover::after {
        transform: scaleY(0);
      }

      .pie {
        margin-top: 28px;
        text-align: center;
        font-family: var(--mono);
        font-size: 9.5px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--apagado);
        line-height: 1.8;
      }
    </style>
  </head>

  <body>
    <main class="menu">
      <div class="cabecera">
        <img
          class="portada"
          src="/civic-road.gif"
          alt=""
          width="168"
          height="168"
          decoding="async"
        />
        <h1>Jondasiviz Build Planner</h1>
        <p class="lema">Planifica la preparación de tu Volkswagen sin pasarte del presupuesto.</p>
      </div>

      <nav class="opciones">
        <div class="opcion actual" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
          <span>Inicio<small>Estás en la pantalla de inicio</small></span>
        </div>

        <a class="opcion principal" href="/herramienta.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          <span>Abrir el planner<small>Modelo, presupuesto y objetivo</small></span>
        </a>

        <button class="opcion" type="button" id="salir">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 12H3M7 8l-4 4 4 4"/><path d="M11 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg>
          <span>Salir<small>Cierra la aplicación</small></span>
        </button>
      </nav>

      <p class="pie">
        Los precios son orientativos.<br />
        Proyecto personal, sin relación con Volkswagen AG.
      </p>
    </main>

    <script>
      (function () {
        var salir = document.getElementById('salir');

        // `withGlobalTauri` deja la API en window.__TAURI__, asi que esta pagina no
        // necesita ningun bundle: es HTML suelto, igual que la landing.
        var enTauri = !!(window.__TAURI__ || window.__TAURI_INTERNALS__);

        if (!enTauri) {
          // La misma pagina existe en el build web, y ahi una web no puede cerrarse
          // sola. Antes que dejar un boton que no hace nada, se quita.
          salir.remove();
          return;
        }

        salir.addEventListener('click', function () {
          try {
            window.__TAURI__.window.getCurrentWindow().close();
          } catch (e) {
            // Si la API cambia de sitio en una version futura, al menos se ve por que.
            console.error('No se pudo cerrar la ventana:', e);
          }
        });
      })();
    </script>
  </body>
</html>
